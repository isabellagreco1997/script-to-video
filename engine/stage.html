<!doctype html>
<meta charset="utf-8">
<style>
  html,body{margin:0;background:#0b0b0e;}
  #stage{position:relative;overflow:hidden;background:#0b0b0e;font-family:Impact,'Arial Black',sans-serif;}
  .ly{position:absolute;will-change:transform,opacity;}
  .word{color:#fff;-webkit-text-stroke:10px #000;paint-order:stroke fill;font-size:150px;white-space:pre;line-height:1.05;text-align:center;}
  .word.small{font-size:64px;-webkit-text-stroke:6px #000;}
  .chip{background:#0c0c10;color:#f5f2eb;font-size:44px;padding:12px 26px;white-space:nowrap;}
  .imgcard{box-shadow:0 30px 80px rgba(0,0,0,.6);border:4px solid #0c0c10;}
  #bg{position:absolute;left:50%;top:50%;object-fit:cover;}
  #dark{position:absolute;inset:0;background:#000;}
  #flash{position:absolute;inset:0;background:#fff;opacity:0;}
  #grain{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.05) 1px, transparent 1px);background-size:4px 4px;pointer-events:none;}
</style>
<div id="stage" data-om-exportable-video-with-duration-secs="0">
  <img id="bg"><div id="dark"></div><div id="lys"></div><div id="flash"></div><div id="grain"></div>
</div>
<script src="gifmeta.js"></script>
<script src="timeline.js"></script>
<script>
// META = {w, h, dur} and TL = [...shots] come from timeline.js. Works for 16:9, 9:16, 1:1 — anything.
const W = META.w, H = META.h, DUR = META.dur;
const stage = document.getElementById("stage"), bgEl = document.getElementById("bg"),
      darkEl = document.getElementById("dark"), lysEl = document.getElementById("lys"),
      flashEl = document.getElementById("flash");
stage.style.width = W + "px"; stage.style.height = H + "px"; bgEl.style.width = W + "px"; bgEl.style.height = H + "px";
stage.setAttribute("data-om-exportable-video-with-duration-secs", String(DUR));
window.META = META;
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const outCubic = p=>1-Math.pow(1-p,3);
const outBack = p=>{const c=2.2;return 1+(c+1)*Math.pow(p-1,3)+c*Math.pow(p-1,2);}
let curShot = -1, layerEls = [];
const gifName = src => { const m = /gifs\/([\w-]+)\.gif$/.exec(src||""); return m ? m[1] : null; };
const gifFrame = (name, t) => { const g = GIFMETA[name]; const i = Math.floor(t*g.fps) % g.n; return `gifframes/${name}/f${String(i+1).padStart(3,"0")}.png`; };
window.gifsReady = false;
(async () => {
  const jobs = [];
  for (const name in GIFMETA) for (let i=1;i<=GIFMETA[name].n;i++){
    const im = new Image(); im.src = `gifframes/${name}/f${String(i).padStart(3,"0")}.png`;
    jobs.push(im.decode().catch(()=>{}));
  }
  await Promise.all(jobs); window.gifsReady = true;
})();

function buildShot(si){
  const sh = TL[si];
  lysEl.innerHTML = ""; layerEls = [];
  if (sh.bg){ bgEl.src = sh.bg.src; bgEl.style.display=""; bgEl.style.objectFit = sh.bg.fit||"cover"; bgEl.style.background="#0b0b0e"; darkEl.style.opacity = sh.bg.dark||0; }
  else { bgEl.style.display="none"; darkEl.style.opacity=0; }
  for (const L of (sh.layers||[])){
    let el;
    if (L.type==="img"){ el = document.createElement("img"); el.src=L.src; el.className="ly imgcard";
      el.style.width=(L.w||500)+"px"; if(L.plain) el.classList.remove("imgcard"); if(L.card){ el.style.background="#f7f4ec"; el.style.padding="34px 44px"; el.style.boxSizing="border-box"; el.classList.add("imgcard"); } }
    else { el = document.createElement("div"); el.className="ly word"+(L.cls?" "+L.cls:"");
      el.textContent = L.text||""; if(L.fs) el.style.fontSize=L.fs+"px"; if(L.color) el.style.color=L.color;
      if (L.type==="chip") el.className="ly chip"; if (L.wrap){ el.style.whiteSpace="normal"; el.style.width=L.wrap+"px"; } }
    el.style.left=(L.x||0)+"px"; el.style.top=(L.y||0)+"px";
    lysEl.appendChild(el); layerEls.push(el);
  }
}

function render(t){
  let si = TL.findIndex(s=>t>=s.t0 && t<s.t1);
  if (si<0) si = t>=TL[TL.length-1].t1 ? TL.length-1 : 0;
  if (si!==curShot){ buildShot(si); curShot=si; }
  const sh = TL[si], lt = t - sh.t0, dur = sh.t1 - sh.t0;
  if (sh.bg){
    const gn = gifName(sh.bg.src);
    if (gn) bgEl.src = gifFrame(gn, lt);
    const p = clamp(lt/dur,0,1); const kb = sh.bg.kb||"zin";
    let s=1, x=0, y=0; const k = Math.min(W, H) / 1080;      // pan distances scale with the stage
    if(kb==="zin") s = 1.02+0.10*p;
    else if(kb==="zout") s = 1.12-0.10*p;
    else if(kb==="panL"){ s=1.14; x = (60-120*p)*k; }
    else if(kb==="panR"){ s=1.14; x = (-60+120*p)*k; }
    else if(kb==="panD"){ s=1.14; y = (50-100*p)*k; }
    else if(kb==="panU"){ s=1.14; y = (-50+100*p)*k; }
    else if(kb==="punch"){ s = 1.10-0.08*clamp(lt/.5,0,1); }
    else if(kb==="still"){ s = 1; }
    if (sh.bg.shake){ x += Math.sin(lt*43)*7; y += Math.cos(lt*37)*6; }
    bgEl.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px)) scale(${s})`;
  }
  flashEl.style.opacity = sh.flash!==undefined ? clamp(1-(lt-sh.flash)/0.09,0,1)*(lt>=sh.flash?1:0) : 0;
  (sh.layers||[]).forEach((L,i)=>{
    const el = layerEls[i]; if(!el) return;
    const tin = L.in||0, d = L.d||0.42;
    let p = clamp((lt-tin)/d,0,1);
    if (lt < tin || (L.out!==undefined && lt >= L.out)){ el.style.opacity=0; return; }
    el.style.opacity = 1;
    const lgn = gifName(L.src);
    if (lgn) el.src = gifFrame(lgn, lt);
    const rot = L.rot||0, anim = L.anim||"pop";
    if (L.type==="counter"){ el.textContent = Math.round(outCubic(p)*L.to).toLocaleString(); }
    if (L.spin){ el.style.transform = `rotate(${(lt*120)%360}deg)`; return; }
    let extra = "";
    if (L.shake && p>=1){ extra = ` translate(${Math.sin(lt*45)*7}px, ${Math.cos(lt*39)*6}px)`; }
    if (L.zoomTo){ const zp = clamp(lt/dur,0,1); el.style.transformOrigin = L.origin||"50% 50%";
      el.style.transform = `rotate(${rot}deg) scale(${1+(L.zoomTo-1)*zp})`;
      if (p<1) el.style.opacity = p; return; }
    if (anim==="pop"){ const s = outBack(p); el.style.transform=`rotate(${rot}deg) scale(${s})`+extra; }
    else if (anim==="slideU"){ el.style.transform=`rotate(${rot}deg) translateY(${(1-outCubic(p))*220}px)`; el.style.opacity=p; }
    else if (anim==="slideD"){ el.style.transform=`rotate(${rot}deg) translateY(${(1-outCubic(p))*-220}px)`; el.style.opacity=p; }
    else if (anim==="slideL"){ el.style.transform=`rotate(${rot}deg) translateX(${(1-outCubic(p))*-320}px)`; el.style.opacity=p; }
    else if (anim==="slideR"){ el.style.transform=`rotate(${rot}deg) translateX(${(1-outCubic(p))*320}px)`; el.style.opacity=p; }
    else if (anim==="fade"){ el.style.transform=`rotate(${rot}deg)`; el.style.opacity=p; }
    else if (anim==="grow"){ el.style.transform=`rotate(${rot}deg) scaleX(${outCubic(p)})`; el.style.transformOrigin="left center"; }
  });
}

stage.addEventListener("data-om-seek-to-time-frame", e=>{ render(clamp(e.detail.time,0,DUR-0.001)); });
render(0);
</script>
